name: proof

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reference-and-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Run proof suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  binary-runtime-artifact:
    runs-on: ubuntu-latest
    env:
      SOURCE_HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install binary build dependency
        run: python -m pip install --disable-pip-version-check cython
      - name: Build binary runtime
        run: |
          python scripts/build_binary_runtime.py \
            --source-commit "${GITHUB_SHA}" \
            --source-head-commit "${SOURCE_HEAD_COMMIT}" \
            --output dist/proof-gym-runtime
      - name: Verify binary manifest identity
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("dist/proof-gym-runtime/BINARY_RUNTIME_MANIFEST.json")
          doc = json.loads(path.read_text())
          assert doc["source_commit"] == os.environ["GITHUB_SHA"]
          assert doc["source_head_commit"] == os.environ["SOURCE_HEAD_COMMIT"]
          assert doc["build"]["python_version"].startswith("3.13.")
          assert doc["build"]["python_soabi"].startswith("cpython-313-")
          assert doc["build"]["requires_system_libpython"] is True
          assert "external-agent-train" in doc["runtime_roles"]
          compat = doc["compatibility"]
          assert compat["schema"] == "proof-gym-binary-runtime-compatibility-v1"
          assert compat["contract_version"] == 1
          assert compat["training_role"] == "external-agent-train"
          assert compat["agent_protocol"] == "proof-gym-agent-jsonl-v1"
          assert compat["external_training_receipt_format"] == "proof-gym-external-training-receipt-v1"
          assert compat["learning_write_authority"] is False
          assert compat["training_surface_file_count"] > 20
          assert len(compat["training_surface_sha256"]) == 64
          assert compat["aggregation_policy"]["mismatch_action"] == "ISOLATE_EVIDENCE"
          assert compat["aggregation_policy"]["behavior_equivalence_required"] is True
          print(json.dumps(doc, indent=2, sort_keys=True))
          PY
      - name: Validate bundled runtime
        run: dist/proof-gym-runtime/proof-gym-runtime validate
      - name: Check source/binary on-policy equivalence
        env:
          PYTHONPATH: src:.
        run: |
          python -m gym.run_on_policy_training_reference > /tmp/source-on-policy.json
          dist/proof-gym-runtime/proof-gym-runtime on-policy-train > /tmp/binary-on-policy.json
          cmp /tmp/source-on-policy.json /tmp/binary-on-policy.json
      - name: Check source/binary negative-training equivalence
        env:
          PYTHONPATH: src:.
        run: |
          python -m gym.run_negative_experience_training_reference > /tmp/source-negative.json
          dist/proof-gym-runtime/proof-gym-runtime negative-train > /tmp/binary-negative.json
          cmp /tmp/source-negative.json /tmp/binary-negative.json
      - name: Smoke external-agent training receipts
        run: |
          dist/proof-gym-runtime/proof-gym-runtime agent-socket-server \
            --host 127.0.0.1 --port 8765 > /tmp/agent-server.out 2>/tmp/agent-server.err &
          agent_pid=$!
          trap 'kill "$agent_pid" 2>/dev/null || true' EXIT
          sleep 1
          dist/proof-gym-runtime/proof-gym-runtime external-agent-train \
            --agent-host 127.0.0.1 --agent-port 8765 > /tmp/external-training.json
          python - <<'PY'
          import json
          from pathlib import Path

          doc = json.loads(Path("/tmp/external-training.json").read_text())
          assert doc["gym_applied_learning"] is False
          assert doc["consumer_must_apply_receipts"] is True
          assert doc["task_count"] > 0
          assert doc["positive_receipt_count"] == doc["task_count"]
          assert doc["typed_negative_receipt_count"] == 0
          assert doc["non_learning_receipt_count"] == 0
          assert all(row["learning_admissible"] for row in doc["receipts"])
          print(json.dumps({
              "task_count": doc["task_count"],
              "positive_receipt_count": doc["positive_receipt_count"],
          }, sort_keys=True))
          PY
          kill "$agent_pid" 2>/dev/null || true
          wait "$agent_pid" 2>/dev/null || true
          trap - EXIT
      - name: Verify final binary payload coverage
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("dist/proof-gym-runtime")
          doc = json.loads((root / "BINARY_RUNTIME_MANIFEST.json").read_text())
          binary = root / doc["artifact"]["binary"]
          binary_sha = hashlib.sha256(binary.read_bytes()).hexdigest()
          assert binary_sha == doc["artifact"]["binary_sha256"]

          declared = set(doc["artifact"]["payload"])
          actual = {
              path.relative_to(root).as_posix()
              for path in (root / "lib").rglob("*")
              if path.is_file()
          }
          assert actual == declared, {
              "unlisted": sorted(actual - declared),
              "missing": sorted(declared - actual),
          }
          for relative, metadata in doc["artifact"]["payload"].items():
              digest = hashlib.sha256((root / relative).read_bytes()).hexdigest()
              assert digest == metadata["sha256"], relative
          assert not list((root / "lib").rglob("__pycache__"))
          assert not list((root / "lib").rglob("*.pyc"))
          print(json.dumps({
              "binary_sha256": binary_sha,
              "payload_file_count": len(actual),
              "manifest_complete": True,
          }, sort_keys=True))
          PY
      - name: Upload proof-gym runtime
        uses: actions/upload-artifact@v4
        with:
          name: proof-gym-runtime-linux-x86_64-cpython313
          path: dist/proof-gym-runtime
          if-no-files-found: error
          retention-days: 14
